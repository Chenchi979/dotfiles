# ~/.config/picom/picom.conf  ·  phant0m
# El backend lo elige bspwmrc al arrancar: glx con aceleración 3D, xrender sin ella.
# Si lanzas picom a mano: picom --backend xrender

backend = "glx";
vsync = true;

#==================== ESQUINAS ====================
corner-radius = 12;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#==================== SOMBRAS ====================
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];

#==================== FUNDIDOS ====================
fading = true;
fade-in-step  = 0.06;
fade-out-step = 0.06;

#==================== TRANSPARENCIA ====================
# La de Kitty la pone el propio kitty.conf; aquí solo ventanas inactivas un poco más tenues
inactive-opacity = 1.0;
frame-opacity = 1.0;

# Sin blur: en máquinas virtuales consume mucho
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-opacity = true;
use-damage = true;
