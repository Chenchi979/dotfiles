; ~/.config/polybar/config.ini  ·  phant0m
; Recargar: super + alt + r  (reinicia bspwm, que relanza polybar)

[colors]
bg        = #1a1b26
bg-alt    = #24283b
fg        = #c0caf5
muted     = #545c7e
blue      = #7aa2f7
green     = #9ece6a
red       = #f7768e
purple    = #bb9af7
yellow    = #e0af68

[bar/main]
monitor      = ${env:MONITOR:}
width        = 100%
height       = 28
offset-x     = 0
offset-y     = 0
radius       = 0
fixed-center = true
bottom       = false

background = ${colors.bg}
foreground = ${colors.fg}

padding-left  = 1
padding-right = 2
module-margin = 1

font-0 = "Hack Nerd Font:size=10;3"
font-1 = "Hack Nerd Font:size=13;3"

separator = "%{F#414868}|%{F-}"

modules-left   = bspwm
modules-center = target
modules-right  = vpn ip cpu memory date powermenu

wm-restack        = bspwm
enable-ipc        = true
cursor-click      = pointer

;==================== ESCRITORIOS ====================
[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click   = true
enable-scroll  = false

label-focused            = %name%
label-focused-foreground = ${colors.bg}
label-focused-background = ${colors.blue}
label-focused-padding    = 1

label-occupied            = %name%
label-occupied-foreground = ${colors.purple}
label-occupied-padding    = 1

label-urgent            = %name%
label-urgent-foreground = ${colors.bg}
label-urgent-background = ${colors.red}
label-urgent-padding    = 1

label-empty            = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding    = 1

;==================== HACKING ====================
[module/target]
type     = custom/script
exec     = ~/.config/polybar/scripts/target.sh
interval = 2

[module/vpn]
type     = custom/script
exec     = ~/.config/polybar/scripts/vpn.sh
interval = 3
; clic: copia la IP de la VPN al portapapeles
click-left = ~/.config/polybar/scripts/vpn.sh copy

[module/ip]
type     = custom/script
exec     = ~/.config/polybar/scripts/ip.sh
interval = 5
; clic: copia tu IP local al portapapeles
click-left = ~/.config/polybar/scripts/ip.sh copy

;==================== SISTEMA ====================
[module/cpu]
type           = internal/cpu
interval       = 2
format-prefix  = "󰻠 "
format-prefix-foreground = ${colors.yellow}
label          = %percentage:2%%

[module/memory]
type           = internal/memory
interval       = 3
format-prefix  = "󰍛 "
format-prefix-foreground = ${colors.purple}
label          = %gb_used%

[module/date]
type          = internal/date
interval      = 1
date          = %d/%m
time          = %H:%M
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.blue}
label         = %date% %time%

[module/powermenu]
type          = custom/text
format        = "⏻"
format-foreground = ${colors.red}
click-left    = ~/.config/rofi/powermenu.sh

[settings]
screenchange-reload = true
